<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mon OS</title>
<style>
:root{--c1:#00e5ff;--c2:#d500f9;--bg:#05030f;--fg:#e9ecff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
#wall{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 100%,#2a0f4a,transparent 65%),linear-gradient(#05030f,#120a30);overflow:hidden}
#wall::after{content:"";position:absolute;left:-60%;right:-60%;bottom:0;height:46%;opacity:.3;transform:perspective(280px) rotateX(62deg);transform-origin:50% 100%;
background:repeating-linear-gradient(90deg,var(--c1) 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,var(--c1) 0 1px,transparent 1px 40px);animation:g 3s linear infinite}
@keyframes g{to{background-position:0 40px,0 40px}}
@media (prefers-reduced-motion:reduce){#wall::after{animation:none}}
#icons{position:absolute;left:0;top:0;right:0;bottom:56px;padding:18px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px}
.ic{width:96px;padding:12px 4px;text-align:center;border:0;border-radius:16px;background:rgba(255,255,255,.04);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.ic:active{background:rgba(255,255,255,.14)}
.ic b{display:block;font-size:38px;margin-bottom:4px;filter:drop-shadow(0 0 8px var(--c1))}
.win{position:absolute;width:min(330px,92vw);background:rgba(12,8,36,.95);border:2px solid var(--c1);border-radius:14px;box-shadow:0 0 22px var(--c1);overflow:hidden}
.win header{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;background:linear-gradient(90deg,var(--c1),var(--c2));color:#05030f;font-weight:700;touch-action:none;cursor:move}
.win header button{border:0;background:rgba(0,0,0,.2);color:#05030f;font-size:18px;width:38px;height:34px;border-radius:8px}
.body{padding:12px;max-height:calc(100vh - 130px);overflow-y:auto}
textarea{width:100%;height:210px;background:#0a0620;color:var(--fg);border:1px solid var(--c1);border-radius:8px;padding:10px;font:inherit;resize:none;user-select:text;-webkit-user-select:text}
.disp{background:#0a0620;border:1px solid var(--c1);border-radius:8px;padding:12px;font-size:26px;text-align:right;min-height:54px;margin-bottom:8px;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button.k{border:1px solid var(--c1);background:rgba(255,255,255,.05);color:var(--fg);font:inherit;font-size:20px;height:46px;border-radius:10px}
button.k:active{background:var(--c1);color:#05030f}
.big{font-size:44px;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 12px;text-shadow:0 0 14px var(--c1)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
canvas{display:block;margin:0 auto;border:1px solid var(--c1);border-radius:8px;background:#05030f;touch-action:none;max-width:100%}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(10,6,30,.9);border-top:2px solid var(--c1);box-shadow:0 -2px 20px var(--c1)}
#bar .logo{font-weight:800;letter-spacing:.1em;text-shadow:0 0 10px var(--c1);padding-right:6px}
#tasks{flex:1;display:flex;gap:6px;overflow-x:auto}
.chip{border:1px solid var(--c1);background:rgba(255,255,255,.06);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;white-space:nowrap}
#clock{font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
#quit{border:1px solid var(--c2);background:rgba(255,255,255,.06);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit}
.gbpad{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:0 4px}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px}
.gbb{width:52px;height:52px;border-radius:12px;border:1px solid var(--c1);background:rgba(255,255,255,.06);color:var(--fg);font:inherit;font-size:20px;touch-action:none}
.gbb.on{background:var(--c1);color:#05030f;box-shadow:0 0 14px var(--c1)}
.abtn{display:flex;gap:12px;transform:rotate(-14deg)}
.abtn .gbb{width:64px;height:64px;border-radius:50%;font-weight:700}
.ss{display:flex;gap:12px;justify-content:center;margin-top:10px}
.ss .gbb{width:88px;height:34px;font-size:13px;border-radius:17px}
.gbtop{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.gbtop .k{flex:1 1 30%;font-size:14px;height:38px}
.gbst{font-size:12px;opacity:.75;text-align:center;margin-top:6px;min-height:16px}
.gbp{margin-top:8px}
.gbrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--c1);border-radius:10px;margin-bottom:6px;font-size:13px;background:rgba(255,255,255,.04)}
.gbrow img,.gbrow .ph{width:64px;height:58px;border-radius:6px;object-fit:cover;background:#05030f;flex:none}
.gbrow .nm{flex:1;min-width:0}
.gbrow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbrow .nm small{opacity:.7}
.gbrow button{border:1px solid var(--c1);background:rgba(255,255,255,.06);color:var(--fg);border-radius:8px;font:inherit;font-size:13px;padding:8px 10px;min-height:36px}
.gbrow button:active{background:var(--c1);color:#05030f}
</style></head>

<div id="wall"></div>
<div id="icons"></div>
<div id="wins"></div>
<div id="bar"><span class="logo">COs</span><div id="tasks"></div><span id="clock"></span><button id="quit">⏻ Quitter</button></div>
<script>
var Q=new URLSearchParams(location.search);

function $(s){return document.querySelector(s)}

function pad(n){return (n<10?'0':'')+n}
var z=10,n=0,wins={};

function GB(rom,fb,pal){

  // ---- registres

  io[0x40]=0x91;io[0x47]=0xFC;io[0x48]=0xFF;io[0x49]=0xFF;io[0x0F]=0x01;io[0x41]=0x85;
  io[0x26]=0x80;io[0x24]=0x77;io[0x25]=0xF3;io[0x11]=0xBF;io[0x12]=0xF3;
  // ---- memoire
  function rb(a){
    switch(a>>12){
      case 0:case 1:case 2:case 3:
        if(a<0x4000)return rom[((mbc==1&&mode?(b2<<5)%nb:0)<<14)+a];

        return rom[((romBank%nb)<<14)+(a-0x4000)];
      case 8:case 9:return vram[a&0x1FFF];

      default:

        if(a<0xFF00)return 0xFF;

  }
  function ior(r){
    switch(r){

  }
  function wb(a,v){
    switch(a>>12){
      case 0:case 1:ramEn=(v&15)==10;return;

      case 6:case 7:if(mbc==1)mode=v&1;return;

  }
  function iow(r,v){
    switch(r){
      case 0:io[0]=v&0x30;return;

      case 0x0F:io[0x0F]=v&0x1F;return;

        if((v&0x80)==0&&(io[0x40]&0x80)){ly=0;lcyc=0;pmode=0}

      case 0x41:io[0x41]=(io[0x41]&7)|(v&0x78);return;

  function f8(){var v=rb(PC);PC=(PC+1)&0xFFFF;return v}
  function f16(){var l=rb(PC),h=rb((PC+1)&0xFFFF);PC=(PC+2)&0xFFFF;return h<<8|l}
  function push(v){SP=(SP-1)&0xFFFF;wb(SP,v>>8);SP=(SP-1)&0xFFFF;wb(SP,v&255)}

      case 4:r=a&v;F=(r==0?0x80:0)|0x20;R[7]=r;break;
      case 5:r=a^v;F=(r==0?0x80:0);R[7]=r;break;

    }

  function cb(){
    var op=f8(),z=op&7,y=(op>>3)&7,x=op>>6,v=get(z),r,cy;

        case 1:cy=v&1;r=(v>>1)|(cy<<7);break;
        case 2:cy=v>>7;r=((v<<1)|((F&0x10)?1:0))&255;break;
        case 3:cy=v&1;r=(v>>1)|((F&0x10)?0x80:0);break;

        case 5:cy=v&1;r=(v>>1)|(v&0x80);break;

  function exec(){

      case 0xE8:e=(f8()<<24)>>24;F=(((SP&15)+(e&15))>15?0x20:0)|(((SP&255)+(e&255))>255?0x10:0);SP=(SP+e)&0xFFFF;return 16;

  }

function openApp(id){
  if(wins[id]){wins[id].el.style.zIndex=++z;return}
  var a=APPS[id],w=el('div','win'),h=el('header'),o={};
  if(a.w)w.style.width='min('+a.w+'px,96vw)';

  a.make(b,o);
  x.onclick=function(){if(o.stop)o.stop();w.remove();delete wins[id];tasks()};
  var dx=0,dy=0,dr=false;
  h.onpointerdown=function(e){if(e.target===x)return;dr=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;w.style.zIndex=++z;h.setPointerCapture(e.pointerId)};

  h.onpointerup=h.onpointercancel=function(){dr=false};
  $('#wins').appendChild(w);wins[id]={el:w,o:o};tasks()}
