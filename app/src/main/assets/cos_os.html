  w.onpointerdown=function(){if(act!==id&&wins[id])foc(id)};
  var dx=0,dy=0,dr=false;
  h.onpointerdown=function(e){if(wb.contains(e.target)||w.classList.contains('max'))return;dr=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;h.setPointerCapture(e.pointerId)};
  h.onpointermove=function(e){if(dr){w.style.left=Math.min(innerWidth-60,e.clientX-dx)+'px';w.style.top=Math.min(innerHeight-90,Math.max(0,e.clientY-dy))+'px'}};
  h.onpointerup=h.onpointercancel=function(){dr=false};
  var rs=false,sx=0,sy=0,sw=0,sh=0;

  rz.onpointermove=function(e){if(rs){w.style.width=Math.max(240,sw+e.clientX-sx)+'px';w.style.height=Math.max(160,sh+e.clientY-sy)+'px'}};
  rz.onpointerup=rz.onpointercancel=function(){rs=false}}

function fillStart(q){var l=$('#sl');l.innerHTML='';q=(q||'').toLowerCase();
  Object.keys(APPS).forEach(function(id){if(q&&APPS[id].t.toLowerCase().indexOf(q)<0)return;
    var b=el('button','si');b.innerHTML='<b>'+APPS[id].i+'</b>'+APPS[id].t;b.onclick=function(){openApp(id)};l.appendChild(b)})}
$('#sb').onclick=function(){var s=$('#start'),o=!s.classList.contains('open');if(o){$('#ss').value='';fillStart('')}s.classList.toggle('open',o);$('#sb').classList.toggle('on',o);if(o&&!matchMedia('(pointer:coarse)').matches)$('#ss').focus()};

$('#icons').onpointerdown=function(e){if(e.target.id==='icons')ics.forEach(function(i){i.classList.remove('sel')})};
$('#quit').onclick=function(){Object.keys(wins).forEach(function(id){var o=wins[id].o;if(o&&o.stop)try{o.stop()}catch(e){}});setTimeout(function(){if(window.Android)Android.exit()},400)};

setInterval(tick,1000);tick();
